# Acesso a aba vantagens e validando login automatico
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: ${output.home.btnTabbarAdvantages}
- waitForAnimationToEnd:
    timeout: 5000

- assertVisible: "Meus Créditos"

- assertVisible: ${output.advantages.optPerfil}
- tapOn: ${output.advantages.optPerfil}
- assertVisible: ${USERNAME}
