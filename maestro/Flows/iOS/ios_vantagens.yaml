appId: br.com.ticket.stg
name: VAlidar aba Vantagens
tags: 
  - core
  - vantagens
env:
    USERNAME: automacao@gmail.com
    PASSWORD: Teste@123
onFlowStart:
  - runFlow: ./subflows/ios_login_default.yaml
