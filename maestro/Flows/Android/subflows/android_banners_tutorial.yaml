appId: br.com.mobile
name: Validar exibicao dos banners - Android
tags: 
  - payments
  - core
  - onboarding
  - login
---
#Banner antigo, comentado pra quando for reativado
- runFlow:
    when:
      visible: "OK, entendi"
    commands:
        - tapOn: "OK, entendi"

#Banner da Rappi
- runFlow:
    when:
      visible: "Vai pedir delivery e pagar com Ticket? Prefira Rappi!"
    commands:
        - tapOn:
            point: "50%,15%"        

#Banner da nova home
- runFlow:
    when:
      visible: "Novidades no app!\nNosso app te oferece serviços gerais e do cartão, pagamentos e descontos. Veja onde encontrar tudo isso!"
    commands:
        - waitForAnimationToEnd:
            timeout: 500


