appId: br.com.mobile
name: Validar realizar login com sucesso
tags:
  - onboarding
  - login
#Esse env será removido após o code review e será chamado dentro do flow passando login e senha de acordo com home desejada  
 
---
- runFlow: ./android_loader_pages.yaml
 
#Realizar Login valido
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 50000
 
 
- runFlow:
    when:
      visible: ${output.login.modalConfirmBR}
    commands:
        - tapOn: ${output.login.modalConfirmBR}  
 
- runFlow:
    when:
      visible: ${output.login.modalConfirmUS}
    commands:
        - tapOn: ${output.login.modalConfirmUS}   
 
#Caso esteja desatualizado, clicar em não atualizar o APP
- runFlow:
    when:
      visible: ${output.login.softUpdateBanner}
    commands:
        - tapOn: ${output.login.optSoftUpdate}  
 
- extendedWaitUntil:
    visible: ${output.login.btnFirstScreenLogin}
    timeout: 50000        
 
- tapOn: ${output.login.btnFirstScreenLogin}
 
- runFlow:
    when:
      visible: ${output.login.optContinuar}
    commands:
        - tapOn: ${output.login.optContinuar}
- runFlow:
    when:
      visible: ${output.login.optContinue}
    commands:
        - tapOn: ${output.login.optContinue}
 
 
- extendedWaitUntil:
    visible: "Acesse sua conta"
    timeout: 10000
- tapOn:
        id: ${output.login.fldLoginEmail}
        optional: true
- tapOn:
        id: ${output.login.fldLoginEmail}
        optional: true

