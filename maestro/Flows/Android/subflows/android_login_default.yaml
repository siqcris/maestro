    id: ${output.login.fldLoginPassword} #Campo senha no form de login
- inputText: ${PASSWORD}
- scrollUntilVisible:
    element: ${output.login.btnLogin}
    direction: DOWN
- tapOn: ${output.login.btnLogin}
 
- waitForAnimationToEnd:
    timeout: 50000
    
